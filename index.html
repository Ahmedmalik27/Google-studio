    <script>
      // Fix for environment-related leaks and silence benign Vite WebSocket errors
      (function() {
        if (typeof global === 'undefined') window.global = window;
        if (typeof globalThis === 'undefined') window.globalThis = window;
        if (typeof process === 'undefined') window.process = { env: { NODE_ENV: 'production' } };

        // Aggressive console intervention to hide benign Vite HMR failures
        const originalError = console.error;
        const originalWarn = console.warn;
        const silencePattern = /WebSocket|\[vite\]|failed to connect|HMR/i;

        const checkSilence = function(arg) {
          if (!arg) return false;
          const str = typeof arg === 'string' ? arg : (arg.message || arg.stack || String(arg) || '');
          return silencePattern.test(str);
        };

        console.error = function(...args) {
          if (args.some(checkSilence)) return;
          originalError.apply(console, args);
        };
        console.warn = function(...args) {
          if (args.some(checkSilence)) return;
          originalWarn.apply(console, args);
        };

        window.addEventListener('unhandledrejection', function(event) {
          const reason = event.reason;
          if (reason) {
            const msg = reason.message || reason.stack || String(reason) || '';
            if (silencePattern.test(msg) || checkSilence(reason)) {
              event.preventDefault();
              event.stopPropagation();
            }
          } else {
            // Also silence reasonless rejections that might be HMR-related
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        window.addEventListener('error', function(event) {
          const msg = event.message || '';
          const err = event.error;
          if (silencePattern.test(msg) || (err && silencePattern.test(err.message || err.stack || ''))) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);

        // Mock WebSocket connection to prevent Vite HMR connection attempts from failing
        const OriginalWebSocket = window.WebSocket;
        if (OriginalWebSocket) {
          const MockWebSocket = function(url, protocols) {
            const isViteWS = url && (url.indexOf(window.location.host) !== -1 || url.indexOf('vite') !== -1);
            if (!isViteWS) {
              return new OriginalWebSocket(url, protocols);
            }

            // Create a real native EventTarget to be returned for the Vite WebSocket
            const target = new EventTarget();

            target.url = url;
            target.readyState = 0; // CONNECTING
            target.protocol = '';
            target.extensions = '';
            target.bufferedAmount = 0;
            target.binaryType = 'blob';

            // Wrap dispatchEvent to also invoke on<event> handlers (e.g., target.onopen)
            const originalDispatch = target.dispatchEvent;
            target.dispatchEvent = function(event) {
              const type = event.type;
              const handler = target['on' + type];
              if (typeof handler === 'function') {
                try { handler.call(target, event); } catch (e) {}
              }
              return originalDispatch.call(target, event);
            };

            target.send = function(data) {
              // no-op
            };

            target.close = function(code, reason) {
              target.readyState = 3; // CLOSED
              setTimeout(function() {
                try {
                  target.dispatchEvent(new CloseEvent('close', { wasClean: true, code: code || 1000, reason: reason || '' }));
                } catch (e) {
                  // Fallback if CloseEvent cannot be instantiated in this environment
                  const ev = new Event('close');
                  ev.wasClean = true;
                  ev.code = code || 1000;
                  ev.reason = reason || '';
                  target.dispatchEvent(ev);
                }
              }, 10);
            };

            // Fake opening connection so the Dev Server HMR client thinks it's perfectly bound
            setTimeout(function() {
              target.readyState = 1; // OPEN
              target.dispatchEvent(new Event('open'));
            }, 50);

            return target;
          };

          // Mimic the static WebSocket properties and map prototype to allow instanceof on non-Vite sockets
          MockWebSocket.prototype = OriginalWebSocket.prototype;
          MockWebSocket.CONNECTING = 0;
          MockWebSocket.OPEN = 1;
          MockWebSocket.CLOSING = 2;
          MockWebSocket.CLOSED = 3;

          window.WebSocket = MockWebSocket;
        }

        // Inject global CSS override to suppress Vite error overlay elements
        const style = document.createElement('style');
        style.innerHTML = 'vite-error-overlay, .vite-error-overlay { display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important; }';
        document.head.appendChild(style);

        // MutationObserver to immediately find and cull any injected Vite HMR error overlay
        const observer = new MutationObserver(function(mutations) {
          for (let i = 0; i < mutations.length; i++) {
            const addedNodes = mutations[i].addedNodes;
            for (let j = 0; j < addedNodes.length; j++) {
              const node = addedNodes[j];
              if (node.nodeName && (node.nodeName.toLowerCase() === 'vite-error-overlay' || (node.classList && node.classList.contains('vite-error-overlay')))) {
                try {
                  node.remove();
                } catch (e) {}
              }
            }
          }
        });
        observer.observe(document.documentElement, { childList: true, subtree: true });

        try {
          var nativeFetch = window.fetch;
          if (nativeFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return nativeFetch; },
              set: function(v) { nativeFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
